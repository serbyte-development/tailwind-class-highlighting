version: 1
repository: Serbyte-Development/tailwind-class-highlighting
branch: main
targets:
  - github
  - vscode_marketplace
  - open_vsx
artifacts:
  workflow: package.yml
  event: push
  names:
    - Linux x64
    - Linux arm64
    - macOS x64
    - macOS arm64
    - Windows x64
    - Windows arm64
github:
  tagPrefix: v
  assets: []
  artifactPatterns:
    - "*.vsix"
vscode_marketplace:
  packageDir: .
  artifactPatterns:
    - "*.vsix"
open_vsx:
  packageDir: .
  artifactPatterns:
    - "*.vsix"
